<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArabSeed Downloader - جالب الروابط المباشرة</title>
    <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css" />
    <style>
        :root {
            --primary-color: #e50914;
            --dark-color: #141414;
            --card-bg: #222;
            --text-color: #fff;
        }
        body {
            font-family: 'Arial', sans-serif;
            background-color: var(--dark-color);
            color: var(--text-color);
            margin: 0;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 2px solid var(--primary-color);
        }
        .search-bar {
            display: flex;
            margin-bottom: 30px;
        }
        .search-bar input {
            flex-grow: 1;
            padding: 12px;
            border: none;
            border-radius: 8px 0 0 8px;
            background-color: var(--card-bg);
            color: var(--text-color);
        }
        .search-bar button {
            padding: 12px 25px;
            background-color: var(--primary-color);
            color: var(--text-color);
            border: none;
            border-radius: 0 8px 8px 0;
            cursor: pointer;
        }
        .swiper-container {
            width: 100%;
            height: 450px;
        }
        .swiper-slide {
            width: 300px;
            height: 450px;
            position: relative;
            overflow: hidden;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.3s;
        }
        .swiper-slide:hover {
            transform: scale(1.05);
        }
        .card-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .card-title {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 10px;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            text-align: center;
        }
        .links-container {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            padding: 20px;
            overflow-y: auto;
            transform: translateY(100%);
            transition: transform 0.4s ease-in-out;
            color: #fff;
        }
        .swiper-slide.expanded .links-container {
            transform: translateY(0);
        }
        .link-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px dashed #555;
        }
        .link-button {
            padding: 6px 12px;
            background-color: var(--primary-color);
            color: var(--text-color);
            border: none;
            border-radius: 5px;
            text-decoration: none;
        }
        #status-message {
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>جالب روابط عرب سيد</h1>
        </header>
        <div class="search-bar">
            <input type="text" id="search-input" placeholder="ابحث عن فيلم أو مسلسل...">
            <button onclick="searchContent()">بحث</button>
        </div>
        <div id="status-message"></div>
        <div class="swiper-container">
            <div class="swiper-wrapper" id="content-slider">
                <!-- البطاقات ستضاف هنا -->
            </div>
            <div class="swiper-pagination"></div>
        </div>
    </div>

    <script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>
    <script>
        const API_BASE_URL = '';
        const contentSlider = document.getElementById('content-slider');
        const searchInput = document.getElementById('search-input');
        const statusMessage = document.getElementById('status-message');
        let swiper;

        async function fetchData(endpoint, method = 'GET', body = null) {
            const options = {
                method: method,
                headers: { 'Content-Type': 'application/json' },
            };
            if (body) {
                options.body = JSON.stringify(body);
            }
            try {
                const response = await fetch(`${API_BASE_URL}${endpoint}`, options);
                if (!response.ok) throw new Error('Network response was not ok');
                return await response.json();
            } catch (error) {
                statusMessage.innerHTML = 'خطأ في الاتصال بالخادم.';
                return null;
            }
        }

        async function loadLatestContent() {
            statusMessage.innerHTML = 'جاري تحميل أحدث الإضافات...';
            const data = await fetchData('/latest');
            statusMessage.innerHTML = '';
            if (data) {
                displayContent(data);
            }
        }

        async function searchContent() {
            const query = searchInput.value.trim();
            if (!query) return;
            statusMessage.innerHTML = `جاري البحث عن: ${query}...`;
            const data = await fetchData(`/search?query=${encodeURIComponent(query)}`);
            statusMessage.innerHTML = '';
            if (data) {
                displayContent(data);
            }
        }

        function displayContent(content) {
            contentSlider.innerHTML = '';
            if (content.length === 0) {
                statusMessage.innerHTML = 'لا توجد نتائج.';
                if (swiper) swiper.destroy();
                swiper = new Swiper('.swiper-container', {}); // Re-init empty swiper
                return;
            }
            content.forEach(item => {
                const slide = document.createElement('div');
                slide.className = 'swiper-slide';
                slide.innerHTML = `
                    <img src="${item.image_url}" class="card-image" alt="${item.title}" onerror="this.src='https://via.placeholder.com/300x450';">
                    <div class="card-title"><h3>${item.title}</h3></div>
                    <div class="links-container"></div>
                `;
                slide.addEventListener('click', (e) => {
                    if (e.target.classList.contains('link-button')) return;
                    toggleLinks(slide, item.url, item.title);
                });
                contentSlider.appendChild(slide);
            });

            if (swiper) swiper.destroy();
            swiper = new Swiper('.swiper-container', {
                loop: content.length > 3,
                slidesPerView: 'auto',
                spaceBetween: 20,
                centeredSlides: true,
                pagination: {
                    el: '.swiper-pagination',
                    clickable: true,
                },
            });
        }

        async function toggleLinks(slide, url, title) {
            const linksContainer = slide.querySelector('.links-container');
            const isExpanded = slide.classList.contains('expanded');

            document.querySelectorAll('.swiper-slide.expanded').forEach(s => {
                if (s !== slide) s.classList.remove('expanded');
            });

            slide.classList.toggle('expanded');

            if (!isExpanded && linksContainer.innerHTML === '') {
                linksContainer.innerHTML = 'جاري جلب الروابط...';
                const links = await fetchData('/links', 'POST', { url: url, title: title });
                displayDownloadLinks(linksContainer, links);
            }
        }

        function displayDownloadLinks(container, links) {
            container.innerHTML = '';
            if (!links || links.length === 0) {
                container.innerHTML = 'لا توجد روابط تحميل.';
                return;
            }
            links.forEach(link => {
                const item = document.createElement('div');
                item.className = 'link-item';
                item.innerHTML = `
                    <span>[${link.quality}] - ${link.server}</span>
                    <a href="${link.link}" target="_blank" class="link-button" onclick="event.stopPropagation();">تحميل</a>
                `;
                container.appendChild(item);
            });
        }

        window.onload = loadLatestContent;
    </script>
</body>
</html>
