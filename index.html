<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArabSeed Downloader - جالب الروابط المباشرة</title>
    <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css" />
    <style>
        :root {
            --primary-color: #e50914;
            --dark-color: #141414;
            --card-bg: #222;
            --text-color: #fff;
        }
        body {
            font-family: 'Arial', sans-serif;
            background-color: var(--dark-color);
            color: var(--text-color);
            margin: 0;
            padding-top: 70px; /* Prevent content from hiding behind fixed navbar */
        }
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1001;
            background-color: #1a1a1a;
            padding: 15px 0;
            border-bottom: 1px solid #333;
        }
        .navbar .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .navbar-brand h1 {
            font-size: 1.5rem;
            margin: 0;
            color: var(--primary-color);
        }
        .navbar-search {
            position: relative;
            display: flex;
            align-items: center;
        }
        .search-input {
            width: 0;
            padding: 8px 0;
            border: none;
            border-bottom: 2px solid var(--primary-color);
            background-color: transparent;
            color: white;
            transition: width 0.4s ease-in-out;
        }
        .search-input.active {
            width: 200px;
            padding: 8px 10px;
        }
        .search-icon {
            cursor: pointer;
            margin-left: 10px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        .main-content {
            padding-top: 20px;
        }
        .swiper-container {
            width: 100%;
            height: 400px; /* Adjusted height */
            padding: 0 10px; /* Add horizontal padding for mobile */
            box-sizing: border-box; /* Ensure padding is included in width */
        }
        .swiper-slide {
            width: 300px; /* Larger width for a more prominent center slide */
            height: 380px; /* Slightly smaller height */
            position: relative;
            overflow: hidden;
            border-radius: 12px; /* Smoother radius */
            cursor: pointer;
            transition: transform 0.4s, box-shadow 0.4s, height 0.4s ease-in-out;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }
        .swiper-slide-active {
            transform: scale(1.08);
        }
        .swiper-slide:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
        }
        .card-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .card-title {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 10px;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            text-align: center;
        }
        .card-title h3 {
            margin: 0;
            font-size: 1.1rem;
        }
        .links-container {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            padding: 20px;
            overflow-y: auto;
            transform: translateY(100%);
            opacity: 0;
            transition: transform 0.4s ease-in-out, opacity 0.4s ease-in-out;
            color: #fff;
        }
        .swiper-slide.expanded {
            height: auto;
            padding-bottom: 20px;
        }
        .swiper-slide.expanded .links-container {
            position: static;
            transform: translateY(0);
            opacity: 1;
            overflow-y: visible;
        }
        .link-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px dashed #555;
        }
        .link-button {
            padding: 6px 12px;
            background-color: var(--primary-color);
            color: var(--text-color);
            border: none;
            border-radius: 5px;
            text-decoration: none;
        }
        #status-message {
            text-align: center;
            padding: 20px;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            body {
                padding-top: 60px;
            }
            .container {
                padding: 0 15px;
            }
            .search-bar {
                flex-direction: column;
            }
            .search-bar input, .search-bar button {
                border-radius: 8px;
                width: 100%;
                box-sizing: border-box;
            }
            .search-bar button {
                margin-top: 10px;
            }
            .swiper-container {
                height: 450px; /* Increased height for larger cards */
            }
            .swiper-slide {
                width: 280px;  /* Increased card width */
                height: 420px; /* Increased card height */
            }
            h1 {
                font-size: 1.5rem;
            }
            .section-title {
                font-size: 1.5rem;
                margin-top: 30px;
                margin-bottom: 15px;
            }
            .card-title h3 {
                font-size: 1rem;
            }
        }
        @media (max-width: 480px) {
            .swiper-slide {
                width: 240px;
                height: 360px;
            }
            .swiper-container {
                height: 380px;
            }
        }

        /* Search Results Styling */
        #search-results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); /* Adjusted minmax */
            gap: 20px; /* Adjusted gap */
            padding: 20px 0;
        }
        .search-result-item {
            position: relative;
            cursor: pointer;
            overflow: hidden;
            border-radius: 12px; /* Smoother radius */
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 0.5s ease forwards;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }
        .search-result-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
        }
        .search-result-item img {
            width: 100%;
            height: auto;
            display: block;
        }
        .search-result-item .title {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            color: white;
            padding: 8px;
            font-size: 0.9rem;
            text-align: center;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.7);
            animation: fadeIn 0.3s;
        }
        .modal-content {
            background-color: var(--card-bg);
            margin: 15% auto;
            padding: 25px;
            border: 1px solid #888;
            width: 80%;
            max-width: 600px;
            border-radius: 10px;
            position: relative;
        }
        .close-button {
            color: #aaa;
            position: absolute;
            left: 25px;
            top: 10px;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }
        .close-button:hover,
        .close-button:focus {
            color: white;
        }
        #modal-links-container .link-item {
             display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px dashed #555;
        }
        .section-title {
            font-size: 1.8rem;
            color: var(--primary-color);
            margin-top: 40px;
            margin-bottom: 20px;
            border-inline-start: 4px solid var(--primary-color);
            padding-inline-start: 15px;
        }
        .details-content .story {
            font-size: 0.9rem;
            line-height: 1.5;
            color: #ccc;
        }
        .details-content .meta-list {
            list-style: none;
            padding: 0;
            font-size: 0.9rem;
        }
        .details-content .meta-list li {
            padding: 5px 0;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="navbar-brand">
                <svg class="logo" width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L2 7V17L12 22L22 17V7L12 2ZM12 4.5L19.5 8.5V15.5L12 19.5L4.5 15.5V8.5L12 4.5Z" fill="var(--primary-color)"/>
                    <path d="M12 12L8 10L12 8L16 10L12 12Z" fill="var(--primary-color)"/>
                </svg>
                <h1>AbuSaifAldeen</h1>
            </div>
            <div class="navbar-search">
                <input type="text" id="search-input" class="search-input" placeholder="بحث...">
                <svg id="search-icon" class="search-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M11 19C15.4183 19 19 15.4183 19 11C19 6.58172 15.4183 3 11 3C6.58172 3 3 6.58172 3 11C3 15.4183 6.58172 19 11 19Z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M21 21L16.65 16.65" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
        </div>
    </nav>

    <div class="container main-content">
        <div id="status-message"></div>
        <div id="search-results"></div> <!-- Container for search results -->

        <!-- Section for Latest Content -->
        <h2 class="section-title">أحدث الإضافات</h2>
        <div id="latest-swiper" class="swiper-container">
            <div class="swiper-wrapper"></div>
            <div class="swiper-pagination"></div>
        </div>

        <!-- Section for Latest Movies -->
        <h2 class="section-title">جديد الأفلام</h2>
        <div id="movies-swiper" class="swiper-container">
            <div class="swiper-wrapper"></div>
            <div class="swiper-pagination"></div>
        </div>

        <!-- Section for Latest TV Shows -->
        <h2 class="section-title">جديد المسلسلات</h2>
        <div id="tvshows-swiper" class="swiper-container">
            <div class="swiper-wrapper"></div>
            <div class="swiper-pagination"></div>
        </div>
    </div>

    <script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>
    <script>
        const API_BASE_URL = '';
        const contentSlider = document.getElementById('content-slider');
        const swiperContainer = document.querySelector('.swiper-container');
        const searchInput = document.getElementById('search-input');
        const statusMessage = document.getElementById('status-message');
        const searchResultsContainer = document.getElementById('search-results');
        let swiper;

        async function fetchData(endpoint, method = 'GET', body = null) {
            const options = {
                method: method,
                headers: { 'Content-Type': 'application/json' },
            };
            if (body) {
                options.body = JSON.stringify(body);
            }
            try {
                const response = await fetch(`${API_BASE_URL}${endpoint}`, options);
                if (!response.ok) throw new Error('Network response was not ok');
                return await response.json();
            } catch (error) {
                statusMessage.innerHTML = 'خطأ في الاتصال بالخادم.';
                return null;
            }
        }

        async function loadAllSections() {
            statusMessage.innerHTML = 'جاري تحميل المحتوى...';

            // Fetch all sections in parallel
            const [latest, movies, tvshows] = await Promise.all([
                fetchData('/latest'),
                fetchData('/movies'),
                fetchData('/tvshows')
            ]);

            statusMessage.innerHTML = '';

            if (latest) displayContent('#latest-swiper', latest);
            if (movies) displayContent('#movies-swiper', movies);
            if (tvshows) displayContent('#tvshows-swiper', tvshows);
        }

        async function searchContent() {
            const query = searchInput.value.trim();
             if (!query) {
                searchResultsContainer.innerHTML = '';
                swiperContainer.style.display = 'block';
                return;
            }
            statusMessage.innerHTML = `جاري البحث عن: ${query}...`;
            swiperContainer.style.display = 'none';
            searchResultsContainer.innerHTML = '';
            const data = await fetchData(`/search?query=${encodeURIComponent(query)}`);
            statusMessage.innerHTML = '';
            if (data) {
                displaySearchResults(data);
            }
        }

        function displaySearchResults(results) {
            if (results.length === 0) {
                statusMessage.innerHTML = 'لا توجد نتائج.';
                return;
            }
            results.forEach((item, index) => {
                const resultItem = document.createElement('div');
                resultItem.className = 'search-result-item';
                resultItem.style.animationDelay = `${index * 0.1}s`;
                resultItem.innerHTML = `
                    <img src="${item.image_url}" alt="${item.title}" onerror="this.parentElement.style.display='none';">
                    <div class="title">${item.title}</div>
                `;
                 resultItem.addEventListener('click', () => openModal(item.url, item.title));
                searchResultsContainer.appendChild(resultItem);
            });
        }

        function displayContent(containerId, content) {
            const swiperWrapper = document.querySelector(`${containerId} .swiper-wrapper`);
            swiperWrapper.innerHTML = '';

            if (content.length === 0) {
                document.querySelector(containerId).style.display = 'none';
                return;
            }

            content.forEach(item => {
                const slide = document.createElement('div');
                slide.className = 'swiper-slide';
                slide.innerHTML = `
                    <img src="${item.image_url}" class="card-image" alt="${item.title}" onerror="this.parentElement.style.display='none';">
                    <div class="card-title"><h3>${item.title}</h3></div>
                    <div class="links-container"></div>
                `;
                slide.addEventListener('click', (e) => {
                    if (e.target.classList.contains('link-button')) return;
                    toggleLinks(slide, item.url, item.title);
                });
                swiperWrapper.appendChild(slide);
            });

            initSwiper(containerId);
        }

        async function toggleLinks(slide, url, title) {
            const linksContainer = slide.querySelector('.links-container');
            const isExpanded = slide.classList.contains('expanded');

            document.querySelectorAll('.swiper-slide.expanded').forEach(s => {
                if (s !== slide) s.classList.remove('expanded');
            });

            slide.classList.toggle('expanded');

            if (!isExpanded && linksContainer.innerHTML === '') {
                linksContainer.innerHTML = 'جاري جلب التفاصيل...';

                // Fetch details and links in parallel
                const [details, links] = await Promise.all([
                    fetchData('/details', 'POST', { url: url, title: title }),
                    fetchData('/links', 'POST', { url: url, title: title })
                ]);

                displayDetailsAndLinks(linksContainer, details, links);

                // Scroll into view after expanding
                setTimeout(() => {
                    slide.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }, 400); // Delay to allow animation to start
            }
        }

        function displayDetailsAndLinks(container, details, links) {
            container.innerHTML = ''; // Clear loading message

            let detailsHtml = '<div class="details-content">';
            if (details) {
                if (details.story) {
                    detailsHtml += `<p class="story">${details.story}</p>`;
                }
                detailsHtml += '<ul class="meta-list">';
                if (details.year) {
                    detailsHtml += `<li><strong>سنة الإنتاج:</strong> ${details.year}</li>`;
                }
                if (details.section) {
                    detailsHtml += `<li><strong>القسم:</strong> ${details.section}</li>`;
                }
                if (details.imdb_rating) {
                    detailsHtml += `<li><strong>تقييم IMDb:</strong> ${details.imdb_rating}</li>`;
                }
                detailsHtml += '</ul>';
            }
            detailsHtml += '</div>';

            let linksHtml = '<h3>روابط التحميل</h3>';
            if (!links || links.length === 0) {
                linksHtml += '<p>لا توجد روابط تحميل متاحة.</p>';
            } else {
                links.forEach(link => {
                    linksHtml += `
                        <div class="link-item">
                            <span>[${link.quality}] - ${link.server}</span>
                            <a href="${link.link}" target="_blank" class="link-button" onclick="event.stopPropagation();">تحميل</a>
                        </div>
                    `;
                });
            }

            container.innerHTML = detailsHtml + linksHtml;
        }

        // Modal Logic
        async function openModal(url, title) {
            const modal = document.getElementById('links-modal');
            const modalTitle = document.getElementById('modal-title');
            const modalLinksContainer = document.getElementById('modal-links-container');

            modalTitle.textContent = `روابط تحميل: ${title}`;
            modalLinksContainer.innerHTML = 'جاري جلب الروابط...';
            modal.style.display = 'block';

            const links = await fetchData('/links', 'POST', { url: url, title: title });
            displayDownloadLinks(modalLinksContainer, links);
        }

        function closeModal() {
            const modal = document.getElementById('links-modal');
            modal.style.display = 'none';
        }

        // Attach close events once the DOM is loaded
        window.addEventListener('DOMContentLoaded', (event) => {
            const modal = document.getElementById('links-modal');
            const closeButton = document.querySelector('.close-button');
            if(closeButton) {
                closeButton.onclick = closeModal;
            }
            window.onclick = (event) => {
                if (event.target == modal) {
                    closeModal();
                }
            };
        });

        function initSwiper(containerId) {
            new Swiper(containerId, {
                effect: 'coverflow',
                grabCursor: true,
                centeredSlides: true,
                slidesPerView: 'auto',
                loop: true,
                spaceBetween: 30, // Add space between slides
                coverflowEffect: {
                    rotate: 50,
                    stretch: 0,
                    depth: 100,
                    modifier: 1,
                    slideShadows: true,
                },
                pagination: {
                    el: `${containerId} .swiper-pagination`,
                    clickable: true,
                },
                breakpoints: {
                    // when window width is >= 768px
                    768: {
                        slidesPerView: 'auto',
                    },
                    // when window width is < 768px
                    0: {
                        slidesPerView: 2,
                        coverflowEffect: {
                            rotate: 30,
                            depth: 50,
                        },
                    }
                }
            });
        }

        window.onload = () => {
            loadAllSections();

            const searchIcon = document.getElementById('search-icon');
            const searchInput = document.getElementById('search-input');

            searchIcon.addEventListener('click', () => {
                searchInput.classList.toggle('active');
                if (searchInput.classList.contains('active')) {
                    searchInput.focus();
                }
            });

            searchInput.addEventListener('keyup', (event) => {
                if (event.key === 'Enter') {
                    searchContent();
                }
            });
        };
    </script>

    <!-- Modal Structure -->
    <div id="links-modal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <h2 id="modal-title">روابط التحميل</h2>
            <div id="modal-links-container"></div>
        </div>
    </div>
</body>
</html>
