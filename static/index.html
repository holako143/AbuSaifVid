<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArabSeed Downloader - جالب الروابط المباشرة</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>جالب روابط عرب سيد المباشرة</h1>
            <p>ابحث عن الأفلام والمسلسلات واحصل على روابط التحميل المباشرة بجميع الجودات.</p>
        </header>

        <div class="search-bar">
            <input type="text" id="search-input" placeholder="أدخل اسم الفيلم أو المسلسل..." onkeypress="if(event.key === 'Enter') searchContent()">
            <button onclick="searchContent()">بحث</button>
        </div>

        <div class="content-section">
            <h2 id="content-title">أحدث الإضافات</h2>
            <div id="content-list" class="content-list">
                <!-- سيتم ملء المحتوى هنا بواسطة JavaScript -->
            </div>
            <div id="status-message" class="status-message">
                <div class="loading-spinner"></div>
                جاري تحميل أحدث الإضافات...
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
